[package]
name = "phistudio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "phistudio"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "phistudio"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tempfile.workspace = true
anyhow.workspace = true
pollster.workspace = true
macroquad.workspace = true
phistudio-core.workspace = true
serde_json.workspace = true
serde.workspace = true
phistudio-prpr.workspace = true
phistudio-audio.workspace = true
phistudio-sdk.workspace = true
base64 = "0.22"
image.workspace = true
semver = "1.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
phistudio-plugins.workspace = true
egui = "=0.21.0"
egui-miniquad = "=0.14.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
wat = "1"
