[package]
name = "phistudio-chart-linter"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phistudio-sdk = { path = "../../crates/phistudio-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
